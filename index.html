<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量子重ね合わせ記憶神経衰弱ゲーム</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .card-container { perspective: 800px; }
  .card-inner { transition: transform 0.5s; transform-style: preserve-3d; position: relative; }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-front, .card-back { backface-visibility: hidden; position: absolute; inset: 0; border-radius: 0.75rem; display: flex; align-items: center; justify-content: center; }
  .card-back { transform: rotateY(180deg); }
  @keyframes entangle { 0%{box-shadow:0 0 0 0 rgba(167,139,250,0.7)} 50%{box-shadow:0 0 20px 10px rgba(167,139,250,0.4)} 100%{box-shadow:0 0 0 0 rgba(167,139,250,0)} }
  .entangle-anim { animation: entangle 1s ease-out; }
  @keyframes fadeIn { from{opacity:0;transform:scale(0.9)} to{opacity:1;transform:scale(1)} }
  .fade-in { animation: fadeIn 0.3s ease-out; }
</style>
</head>
<body class="bg-gray-950 text-white min-h-screen">
<div class="max-w-lg mx-auto p-4">
  <header class="text-center py-5">
    <h1 class="text-2xl font-bold bg-gradient-to-r from-violet-400 to-cyan-400 bg-clip-text text-transparent">量子神経衰弱</h1>
    <p class="text-gray-400 text-sm mt-1">シンボルと量子状態が一致するペアを探せ</p>
  </header>

  <!-- Score bar -->
  <div class="flex justify-between items-center bg-gray-900 rounded-xl p-3 mb-4">
    <div class="text-center">
      <div class="text-xs text-gray-400">マッチ</div>
      <div id="score-matches" class="text-xl font-bold text-violet-400">0</div>
    </div>
    <div class="text-center">
      <div class="text-xs text-gray-400">手数</div>
      <div id="score-moves" class="text-xl font-bold text-cyan-400">0</div>
    </div>
    <div class="text-center">
      <div class="text-xs text-gray-400">ハイスコア</div>
      <div id="high-score" class="text-xl font-bold text-yellow-400">-</div>
    </div>
    <button onclick="initGame()" class="bg-violet-700 hover:bg-violet-600 text-white text-sm px-3 py-2 rounded-lg transition" aria-label="ゲームをリスタート">
      リスタート
    </button>
  </div>

  <!-- Legend -->
  <div class="bg-gray-900 rounded-xl p-3 mb-4 text-xs flex flex-wrap gap-3 text-gray-300">
    <span>|0⟩ = 青色量子状態</span>
    <span>|1⟩ = 赤色量子状態</span>
    <span class="text-yellow-400">★ = 重ね合わせカード（何にでもマッチ）</span>
  </div>

  <!-- Game board -->
  <div id="game-board" class="grid grid-cols-4 gap-3" role="grid" aria-label="ゲームボード"></div>

  <!-- Result overlay -->
  <div id="result-overlay" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="bg-gray-900 rounded-2xl p-8 text-center max-w-xs mx-4 fade-in">
      <div class="text-5xl mb-3">🏆</div>
      <h2 class="text-2xl font-bold text-violet-400 mb-2">クリア！</h2>
      <div id="result-stats" class="text-gray-300 mb-5 space-y-1"></div>
      <button onclick="initGame()" class="w-full bg-violet-600 hover:bg-violet-500 text-white font-bold py-3 rounded-xl transition">
        もう一度プレイ
      </button>
    </div>
  </div>
</div>

<script>
const SYMBOLS = ['◎', '△', '□', '★'];
const SYMBOL_COLORS = { '◎': 'text-cyan-400', '△': 'text-green-400', '□': 'text-orange-400', '★': 'text-yellow-400' };
const HS_KEY = 'quantum-memory-hs';

let cards = [], flipped = [], matched = 0, moves = 0, canFlip = true;

function initGame() {
  document.getElementById('result-overlay').classList.add('hidden');
  matched = 0; moves = 0; flipped = [];
  updateScoreDisplay();
  cards = buildDeck();
  renderBoard();
}

function buildDeck() {
  const deck = [];
  // 8 pairs: 4 symbols × 2 quantum states
  SYMBOLS.forEach(sym => {
    [0, 1].forEach(state => {
      const isSuperposition = Math.random() < 0.03;
      deck.push({ sym, state, superposition: false, id: deck.length, flipped: false, matched: false });
      deck.push({ sym, state, superposition: false, id: deck.length, flipped: false, matched: false });
    });
  });
  // shuffle
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  // randomly add superposition property to 1-2 cards
  const spCount = Math.random() < 0.5 ? 1 : 2;
  const indices = new Set();
  while (indices.size < spCount) indices.add(Math.floor(Math.random() * deck.length));
  indices.forEach(i => deck[i].superposition = true);
  return deck;
}

function renderBoard() {
  const board = document.getElementById('game-board');
  board.innerHTML = '';
  cards.forEach((card, idx) => {
    const container = document.createElement('div');
    container.className = 'card-container h-20';
    container.setAttribute('role', 'gridcell');

    const inner = document.createElement('div');
    inner.className = 'card-inner h-20';
    inner.id = 'card-' + idx;

    // Front (face down)
    const front = document.createElement('div');
    front.className = 'card-front bg-gray-800 border-2 border-gray-700 cursor-pointer';
    const qMark = document.createElement('span');
    qMark.className = 'text-3xl text-gray-600 select-none';
    qMark.textContent = '?';
    front.appendChild(qMark);

    // Back (face up)
    const back = document.createElement('div');
    back.className = 'card-back border-2 cursor-pointer select-none ' +
      (card.superposition ? 'bg-gray-800 border-yellow-500' :
       card.state === 0 ? 'bg-gray-800 border-blue-600' : 'bg-gray-800 border-red-600');

    const symEl = document.createElement('div');
    symEl.className = 'text-center';
    const symSpan = document.createElement('div');
    symSpan.className = 'text-3xl ' + SYMBOL_COLORS[card.sym];
    symSpan.textContent = card.superposition ? '★' : card.sym;
    const stateSpan = document.createElement('div');
    stateSpan.className = 'text-xs mt-1 ' + (card.superposition ? 'text-yellow-400' : card.state === 0 ? 'text-blue-400' : 'text-red-400');
    stateSpan.textContent = card.superposition ? '重ね合わせ' : '|' + card.state + '⟩';
    symEl.appendChild(symSpan); symEl.appendChild(stateSpan);
    back.appendChild(symEl);

    inner.appendChild(front); inner.appendChild(back);
    container.appendChild(inner);

    container.addEventListener('click', () => flipCard(idx));
    container.setAttribute('aria-label', 'カード ' + (idx + 1));
    board.appendChild(container);
  });

  loadHighScore();
}

function flipCard(idx) {
  const card = cards[idx];
  if (!canFlip || card.flipped || card.matched || flipped.length >= 2) return;
  card.flipped = true;
  document.getElementById('card-' + idx).classList.add('flipped');

  flipped.push(idx);
  if (flipped.length === 2) {
    moves++;
    updateScoreDisplay();
    canFlip = false;
    setTimeout(checkMatch, 900);
  }
}

function checkMatch() {
  const [a, b] = flipped;
  const ca = cards[a], cb = cards[b];
  let isMatch = false;

  if (ca.superposition || cb.superposition) {
    isMatch = true;
  } else {
    isMatch = ca.sym === cb.sym && ca.state === cb.state;
  }

  if (isMatch) {
    ca.matched = true; cb.matched = true;
    matched++;
    document.getElementById('score-matches').textContent = matched;
    // Entanglement animation
    ['card-' + a, 'card-' + b].forEach(id => {
      const el = document.getElementById(id);
      el.classList.add('entangle-anim');
      setTimeout(() => el.classList.remove('entangle-anim'), 1000);
    });
    // Gray out matched cards
    [a, b].forEach(idx => {
      const inner = document.getElementById('card-' + idx);
      inner.style.opacity = '0.4';
    });
    if (matched === 8) setTimeout(showResult, 500);
  } else {
    setTimeout(() => {
      [a, b].forEach(idx => {
        cards[idx].flipped = false;
        document.getElementById('card-' + idx).classList.remove('flipped');
      });
    }, 100);
  }
  flipped = [];
  canFlip = true;
}

function updateScoreDisplay() {
  document.getElementById('score-moves').textContent = moves;
  document.getElementById('score-matches').textContent = matched;
}

function showResult() {
  const efficiency = moves > 0 ? (matched / moves * 100).toFixed(0) : 0;
  const stats = document.getElementById('result-stats');
  stats.innerHTML = '';
  [
    ['ペア数', '8 / 8'],
    ['手数', moves + '手'],
    ['効率', efficiency + '%'],
  ].forEach(([label, val]) => {
    const row = document.createElement('div');
    row.className = 'flex justify-between gap-4';
    const lEl = document.createElement('span'); lEl.className = 'text-gray-400'; lEl.textContent = label;
    const vEl = document.createElement('span'); vEl.className = 'text-white font-bold'; vEl.textContent = val;
    row.appendChild(lEl); row.appendChild(vEl);
    stats.appendChild(row);
  });

  const hs = parseInt(localStorage.getItem(HS_KEY)) || 999;
  if (moves < hs) {
    localStorage.setItem(HS_KEY, moves);
    const newHs = document.createElement('div'); newHs.className = 'text-yellow-400 font-bold';
    newHs.textContent = '🎉 新記録！';
    stats.appendChild(newHs);
  }
  loadHighScore();
  document.getElementById('result-overlay').classList.remove('hidden');
}

function loadHighScore() {
  const hs = localStorage.getItem(HS_KEY);
  document.getElementById('high-score').textContent = hs ? hs + '手' : '-';
}

initGame();
</script>
</body>
</html>
